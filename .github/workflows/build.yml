name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install --upgrade buildozer

    - name: Generate and Configure buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
            buildozer init
        fi
        
        # Configure buildozer.spec cleanly
        sed -i 's/^#*title = .*/title = Jarvis AI/' buildozer.spec
        sed -i 's/^#*package.name = .*/package.name = jarvisai/' buildozer.spec
        sed -i 's/^#*package.domain = .*/package.domain = com.jarvis/' buildozer.spec
        sed -i 's/^#*source.include_exts = .*/source.include_exts = py/' buildozer.spec
        sed -i 's/^#*requirements = .*/requirements = python3/' buildozer.spec
        sed -i 's/^#*android.api = .*/android.api = 31/' buildozer.spec
        sed -i 's/^#*android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/^#*android.ndk = .*/android.ndk = 23b/' buildozer.spec
        sed -i 's/^#*android.ndk_api = .*/android.ndk_api = 21/' buildozer.spec
        sed -i 's/^#*p4a.branch = .*/p4a.branch = master/' buildozer.spec

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: ""
        ANDROID_HOME: "/home/runner/work/jarvis-ai/jarvis-ai/.buildozer/android/platform/android-sdk"
      run: yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
