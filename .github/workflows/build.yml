name: Simple Build Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-22.04

      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python Environment
        run: |
          python3 --version
          echo "Environment is clean and working!"

      - name: Package Project Files
        run: |
          mkdir -p bin
          # Your project files are bundled safely here
          zip -r bin/jarvis-ai.zip . -x ".git/*" ".github/*" "bin/*"
          cp bin/jarvis-ai.zip bin/jarvis-ai.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          
