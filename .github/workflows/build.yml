name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

ض    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install buildozer

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/# title = My Application/title = Jarvis AI/' buildozer.spec
            sed -i 's/# package.name = myapp/package.name = jarvisai/' buildozer.spec
            sed -i 's/# package.domain = org.test/package.domain = com.jarvis/' buildozer.spec
            sed -i 's/# source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py/' buildozer.spec
            sed -i 's/# requirements = python3,kivy/requirements = python3/' buildozer.spec
            sed -i 's/# orientation = portrait/orientation = portrait/' buildozer.spec
        fi
        
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
