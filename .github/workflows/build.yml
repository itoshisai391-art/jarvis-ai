name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install --upgrade buildozer

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
            buildozer init
        fi
        
        # Un-comment necessary lines in buildozer.spec
        sed -i 's/^#title/title/' buildozer.spec
        sed -i 's/^#package.name/package.name/' buildozer.spec
        sed -i 's/^#package.domain/package.domain/' buildozer.spec
        sed -i 's/^#source.include_exts/source.include_exts/' buildozer.spec
        sed -i 's/^#requirements/requirements/' buildozer.spec
        sed -i 's/^#android.api/android.api/' buildozer.spec
        sed -i 's/^#android.ndk /android.ndk /' buildozer.spec
        sed -i 's/^#android.ndk_api/android.ndk_api/' buildozer.spec
        
        # Apply stable configuration values to prevent toolchain crashes
        sed -i 's/title = My Application/title = Jarvis AI/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = jarvisai/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.jarvis/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3/' buildozer.spec
        sed -i 's/android.api = 33/android.api = 31/' buildozer.spec
        sed -i 's/android.ndk = 25b/android.ndk = 23b/' buildozer.spec
        sed -i 's/android.ndk_api = 21/android.ndk_api = 31/' buildozer.spec
        sed -i 's/android.ndk_api = 24/android.ndk_api = 31/' buildozer.spec

        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
